<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="52%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="bb-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="bb-drop" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="118" fill="url(#bb-bg)" />
  <rect width="512" height="512" rx="118" fill="url(#bb-glass)" />
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <!-- Monogram & Badge -->
  <g filter="url(#bb-drop)">
    <!-- Central Bold B -->
    <text x="210" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="330" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
    
    <!-- Pediatric / Medical Cross Badge -->
    <g transform="translate(380, 126)">
      <circle cx="0" cy="0" r="50" fill="#ffffff" />
      <circle cx="0" cy="0" r="43" fill="#0284c7" />
      <rect x="-6" y="-23" width="12" height="46" rx="4" fill="#ffffff" />
      <rect x="-23" y="-6" width="46" height="12" rx="4" fill="#ffffff" />
    </g>
  </g>
</svg>