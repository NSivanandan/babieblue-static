<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Babie Blue Clinical Obstetrics and Maternal-Fetal Protocol Diagram">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>
  <rect x="48" y="48" width="1104" height="534" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="48" y="48" width="1104" height="10" rx="5" fill="#0f766e"/>

  <!-- Top Clinical Header -->
  <text x="96" y="112" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f766e" letter-spacing="2">BABIE BLUE CLINICAL REFERENCE • OBSTETRICS &amp; MATERNAL-FETAL MEDICINE</text>
  <text x="96" y="158" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="700" fill="#0f172a">Evidence-Based Prenatal &amp; Maternal Care Protocol</text>
  <line x1="96" y1="184" x2="1104" y2="184" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 3 Clinical Protocol Columns -->
  <g transform="translate(96, 214)">
    <rect width="312" height="270" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/>
    <circle cx="44" cy="44" r="20" fill="#0f766e"/>
    <text x="44" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#ffffff">01</text>
    <text x="80" y="50" font-family="Plus Jakarta Sans, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Clinical Screening</text>
    <text x="28" y="96" font-family="Plus Jakarta Sans, sans-serif" font-size="15" fill="#334155">• Maternal history &amp; baseline labs</text>
    <text x="28" y="130" font-family="Plus Jakarta Sans, sans-serif" font-size="15" fill="#334155">• Gestational age &amp; ultrasound dating</text>
    <text x="28" y="164" font-family="Plus Jakarta Sans, sans-serif" font-size="15" fill="#334155">• ACOG / WHO risk stratification</text>
    <text x="28" y="198" font-family="Plus Jakarta Sans, sans-serif" font-size="15" fill="#334155">• Early biomarker &amp; vital tracking</text>
    <rect x="24" y="220" width="264" height="32" rx="6" fill="#ffffff" stroke="#99f6e4"/>
    <text x="156" y="241" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#0f766e">TIER 1 DIAGNOSTIC WORKUP</text>
  </g>

  <g transform="translate(444, 214)">
    <rect width="312" height="270" rx="14" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2"/>
    <circle cx="44" cy="44" r="20" fill="#0369a1"/>
    <text x="44" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#ffffff">02</text>
    <text x="80" y="50" font-family="Plus Jakarta Sans, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Targeted Management</text>
    <text x="28" y="96" font-family="Plus Jakarta Sans, sans-serif" font-size="15" fill="#334155">• Evidence-graded interventions</text>
    <text x="28" y="130" font-family="Plus Jakarta Sans, sans-serif" font-size="15" fill="#334155">• Trimester-specific dosing safety</text>
    <text x="28" y="164" font-family="Plus Jakarta Sans, sans-serif" font-size="15" fill="#334155">• Nutritional &amp; physiological support</text>
    <text x="28" y="198" font-family="Plus Jakarta Sans, sans-serif" font-size="15" fill="#334155">• Multidisciplinary OB-GYN review</text>
    <rect x="24" y="220" width="264" height="32" rx="6" fill="#ffffff" stroke="#bae6fd"/>
    <text x="156" y="241" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#0369a1">TIER 2 THERAPEUTIC PATHWAY</text>
  </g>

  <g transform="translate(792, 214)">
    <rect width="312" height="270" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <circle cx="44" cy="44" r="20" fill="#b91c1c"/>
    <text x="44" y="50" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#ffffff">03</text>
    <text x="80" y="50" font-family="Plus Jakarta Sans, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Red-Flag Escalation</text>
    <text x="28" y="96" font-family="Plus Jakarta Sans, sans-serif" font-size="15" fill="#334155">• BP ≥ 140/90 mmHg or severe headache</text>
    <text x="28" y="130" font-family="Plus Jakarta Sans, sans-serif" font-size="15" fill="#334155">• Vaginal bleeding or fluid leakage</text>
    <text x="28" y="164" font-family="Plus Jakarta Sans, sans-serif" font-size="15" fill="#334155">• Decreased fetal movement counts</text>
    <text x="28" y="198" font-family="Plus Jakarta Sans, sans-serif" font-size="15" fill="#334155">• Acute fever ≥ 38.0°C (100.4°F)</text>
    <rect x="24" y="220" width="264" height="32" rx="6" fill="#ffffff" stroke="#fecaca"/>
    <text x="156" y="241" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#b91c1c">IMMEDIATE OB TRIAGE CRITERIA</text>
  </g>

  <!-- Footer Attribution -->
  <text x="96" y="542" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600" fill="#475569">Medically Reviewed by Dr. Mangala Devi K.R., MS (OBG) &amp; Dr. Anagha Nawal, MD, MCE, FRM • BabieBlue.com</text>
</svg>
