      <line x1="52" y1="114" x2="454" y2="114" stroke="#cbd5e1" stroke-dasharray="4 4"/>
      <line x1="52" y1="164" x2="454" y2="164" stroke="#cbd5e1" stroke-dasharray="4 4"/>
      <line x1="52" y1="214" x2="454" y2="214" stroke="#cbd5e1" stroke-dasharray="4 4"/>
      <line x1="52" y1="264" x2="454" y2="264" stroke="#475569" stroke-width="1.5"/>
      <line x1="52" y1="64" x2="52" y2="264" stroke="#475569" stroke-width="1.5"/>

