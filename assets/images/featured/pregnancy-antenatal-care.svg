      <text x="45" y="218" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#475569">0.8kg</text>
      <text x="45" y="264" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#475569">CRL</text>

      <!-- 10th-90th Percentile Shaded Band -->
      <path d="M 60 258 C 140 255, 220 236, 300 185 C 360 140, 410 100, 448 86 L 448 124 C 410 138, 360 172, 300 212 C 220 248, 140 260, 60 262 Z" fill="#0284c7" fill-opacity="0.16"/>

      <!-- 50th Percentile Fetal EFW Curve -->
      <path d="M 60 260 C 140 257, 220 242, 300 198 C 360 156, 410 118, 448 104" fill="none" stroke="#0369a1" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Milestone Checkpoints -->
      <circle cx="132" cy="254" r="6" fill="#0369a1" stroke="#ffffff" stroke-width="2"/>
      <text x="132" y="242" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#0369a1">12w NT/NIPT</text>

      <circle cx="236" cy="228" r="6" fill="#0f766e" stroke="#ffffff" stroke-width="2"/>
      <text x="236" y="216" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#0f766e">20w Anatomy</text>

      <circle cx="322" cy="182" r="6" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
      <text x="322" y="168" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#b45309">28w Glucola</text>

      <circle cx="448" cy="104" r="7" fill="#b91c1c" stroke="#ffffff" stroke-width="2"/>
      <text x="415" y="96" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#b91c1c">40w0d EDD (280d)</text>

      <!-- X-Axis Labels -->
      <text x="65" y="282" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="600" fill="#334155">Wk 4</text>
      <text x="160" y="282" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="600" fill="#334155">Wk 14</text>
      <text x="292" y="282" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="600" fill="#334155">Wk 28</text>
      <text x="418" y="282" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="600" fill="#334155">Wk 40</text>

      <!-- Bottom Formula &amp; Ultrasound Redating Rule Card -->
      <rect x="20" y="298" width="444" height="78" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
      <text x="34" y="320" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0369a1">ACOG DATING &amp; ULTRASOUND REDATING THRESHOLDS</text>
      <text x="34" y="341" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">• LMP Formula: EDD = LMP + 280d + (Cycle − 28d) | IVF Day-5: +261d</text>
      <text x="34" y="361" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• CRL Redating Cutoff: &gt;±5d (&lt;9w0d) • &gt;±7d (9w–13w6d) • &gt;±10d (16w–21w6d)</text>
    </g>

  <!-- Bottom Clinical Triage &amp; Medical Review Bar -->
  <rect x="68" y="492" width="1052" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
