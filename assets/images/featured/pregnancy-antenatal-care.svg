<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Antenatal Care Schedule &amp; Clinical Protocol: Week-by-Week Visits, Labs &amp; Ultrasounds — Babie Blue Clinical Reference Diagram">
  <title>Antenatal Care Schedule &amp; Clinical Protocol: Week-by-Week Visits, Labs &amp; Ultrasounds — Clinical Protocol &amp; Visual Reference Diagram</title>
  <desc>Physician-reviewed clinical diagram and quantitative reference chart for Antenatal Care Schedule &amp; Clinical Protocol: Week-by-Week Visits, Labs &amp; Ultrasounds on BabieBlue.com, audited against ACOG, AAP, WHO, and CDC guidelines.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55"/>

  <!-- Outer Clinical Frame -->
  <rect x="36" y="32" width="1128" height="566" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="36" y="32" width="1128" height="10" rx="5" fill="#0369a1"/>

  <!-- Left Column: Header Kicker, Title &amp; 3 Article-Specific Quantitative KPIs -->
  <g transform="translate(68, 72)">
    <rect x="0" y="0" width="42" height="42" rx="10" fill="#0369a1"/>
    <path d="M13 21h16M21 13v16" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="56" y="17" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#0369a1" letter-spacing="1.2">OBSTETRICS &amp; PRENATAL PROTOCOL • ACOG / WHO VERIFIED</text>
    <text x="56" y="36" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#475569">ICD-10-CM: Z34.90 • CANONICAL: /pregnancy/antenatal-care/</text>
  </g>

  <!-- Wrapped Article Title -->
  <g transform="translate(68, 152)">
    <text x="0" y="0" font-family="Fraunces, Georgia, serif" font-size="26.5" font-weight="700" fill="#0f172a">Antenatal Care Schedule &amp; Clinical</text>
    <text x="0" y="34" font-family="Fraunces, Georgia, serif" font-size="26.5" font-weight="700" fill="#0f172a">Protocol: Week-by-Week Visits,</text>
    <text x="0" y="68" font-family="Fraunces, Georgia, serif" font-size="26.5" font-weight="700" fill="#0f172a">Labs &amp; Ultrasounds</text>
  </g>

  <line x1="68" y1="246" x2="612" y2="246" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 3 Article-Specific Quantitative Benchmark Cards -->
  <g transform="translate(68, 264)">
    <rect width="544" height="62" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="12" y="11" width="156" height="40" rx="7" fill="#0f766e"/>
    <text x="90" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14.5" font-weight="800" fill="#ffffff">q4w → q2w → q1w</text>
    <text x="182" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">ACOG Visit Cadence (Wks 4–28, 28–36,</text>
    <text x="182" y="45" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5" font-weight="600" fill="#334155">36–Delivery)</text>
  </g>
  <g transform="translate(68, 336)">
    <rect width="544" height="62" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="12" y="11" width="156" height="40" rx="7" fill="#0369a1"/>
    <text x="90" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14.5" font-weight="800" fill="#ffffff">81 mg/day</text>
    <text x="182" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Low-Dose Aspirin Prophylaxis Starting 12–16w</text>
    <text x="182" y="45" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5" font-weight="600" fill="#334155">for High/Mod Risk</text>
  </g>
  <g transform="translate(68, 408)">
    <rect width="544" height="62" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="12" y="11" width="156" height="40" rx="7" fill="#b45309"/>
    <text x="90" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14.5" font-weight="800" fill="#ffffff">24–28 Weeks</text>
    <text x="182" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Universal Gestational Diabetes (GDM)</text>
    <text x="182" y="45" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5" font-weight="600" fill="#334155">Screening &amp; Anemia Recheck</text>
  </g>

  <!-- Right Column: Bespoke Topic-Matched Clinical Vector Illustration &amp; Chart -->
  
    <g transform="translate(636, 82)">
      <rect width="484" height="394" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="0" y="0" width="484" height="44" rx="16" fill="#0369a1"/>
