      <text x="34" y="357" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• BMI 25.0–29.9: 15–25 lbs • BMI ≥30.0: 11–20 lbs (Safe Floor ≥1,800 kcal/d)</text>
