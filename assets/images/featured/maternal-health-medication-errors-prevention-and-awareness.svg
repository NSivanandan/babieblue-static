<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Medication Error Prevention: Pediatric mL Syringe Dosing &amp; Perinatal Safety — Babie Blue Clinical Reference Diagram">
  <title>Medication Error Prevention: Pediatric mL Syringe Dosing &amp; Perinatal Safety — Clinical Protocol &amp; Visual Reference Diagram</title>
  <desc>Physician-reviewed clinical diagram and quantitative reference chart for Medication Error Prevention: Pediatric mL Syringe Dosing &amp; Perinatal Safety on BabieBlue.com, audited against ACOG, AAP, WHO, and CDC guidelines.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55"/>

  <!-- Outer Clinical Frame -->
  <rect x="36" y="32" width="1128" height="566" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="36" y="32" width="1128" height="10" rx="5" fill="#0f766e"/>

  <!-- Left Column: Header Kicker, Title &amp; 3 Article-Specific Quantitative KPIs -->
  <g transform="translate(68, 72)">
    <rect x="0" y="0" width="42" height="42" rx="10" fill="#0f766e"/>
    <path d="M13 21h16M21 13v16" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="56" y="17" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#0f766e" letter-spacing="1.2">MATERNAL-FETAL &amp; FOURTH-TRIMESTER MEDICINE • ACOG VERIFIED</text>
    <text x="56" y="36" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#475569">ICD-10-CM: T50.905A / Y63.9 (Adverse Effect &amp; Dosage Error Prevention) • CANONICAL: /maternal-health/medication-errors-prevention-and-awareness/</text>
  </g>

  <!-- Wrapped Article Title -->
  <g transform="translate(68, 152)">
    <text x="0" y="0" font-family="Fraunces, Georgia, serif" font-size="26.5" font-weight="700" fill="#0f172a">Medication Error Prevention:</text>
    <text x="0" y="34" font-family="Fraunces, Georgia, serif" font-size="26.5" font-weight="700" fill="#0f172a">Pediatric mL Syringe Dosing &amp;</text>
    <text x="0" y="68" font-family="Fraunces, Georgia, serif" font-size="26.5" font-weight="700" fill="#0f172a">Perinatal Safety</text>
  </g>

  <line x1="68" y1="246" x2="612" y2="246" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 3 Article-Specific Quantitative Benchmark Cards -->
  <g transform="translate(68, 264)">
    <rect width="544" height="62" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="12" y="11" width="156" height="40" rx="7" fill="#0f766e"/>
    <text x="90" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14.5" font-weight="800" fill="#ffffff">mL Only</text>
    <text x="182" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">AAP Metric Dosing Standard — Never use</text>
    <text x="182" y="45" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5" font-weight="600" fill="#334155">household teaspoons (vary 2.5–9 mL)</text>
  </g>
  <g transform="translate(68, 336)">
    <rect width="544" height="62" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="12" y="11" width="156" height="40" rx="7" fill="#0369a1"/>
    <text x="90" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14.5" font-weight="800" fill="#ffffff">160mg/5mL</text>
    <text x="182" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">US Acetaminophen Standard — 32 mg per 1 mL</text>
    <text x="182" y="45" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5" font-weight="600" fill="#334155">uniform pediatric liquid</text>
  </g>
  <g transform="translate(68, 408)">
    <rect width="544" height="62" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="12" y="11" width="156" height="40" rx="7" fill="#b45309"/>
    <text x="90" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14.5" font-weight="800" fill="#ffffff">&gt;=6 Mos</text>
    <text x="182" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Minimum Ibuprofen Age — Contraindicated in</text>
    <text x="182" y="45" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5" font-weight="600" fill="#334155">neonates due to renal maturity</text>
  </g>

  <!-- Right Column: Bespoke Topic-Matched Clinical Vector Illustration &amp; Chart -->
  
    <g transform="translate(636, 82)">
      <rect width="484" height="394" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="0" y="0" width="484" height="44" rx="16" fill="#b91c1c"/>
      <rect x="0" y="24" width="484" height="20" fill="#b91c1c"/>
      <text x="20" y="27" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.8">FIG 1 • AAP WEIGHT-BASED ORAL SYRINGE (mL) &amp; FEVER TRIAGE</text>

      <!-- Graduated Oral Dosing Syringe Vector Illustration -->
      <g transform="translate(28, 66)">
        <rect x="0" y="0" width="428" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <text x="16" y="22" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#0f766e">CALIBRATED ORAL SYRINGE • ACETAMINOPHEN 160 mg / 5 mL (32 mg/mL)</text>
        <!-- Syringe Plunger &amp; Barrel -->
        <rect x="20" y="42" width="60" height="14" rx="3" fill="#94a3b8"/>
        <rect x="14" y="34" width="8" height="30" rx="2" fill="#475569"/>
        <rect x="80" y="32" width="290" height="34" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
        <!-- Liquid Fill up to 3.75 mL -->
        <rect x="82" y="34" width="215" height="30" fill="#0f766e" fill-opacity="0.28"/>
        <line x1="297" y1="32" x2="297" y2="66" stroke="#0f766e" stroke-width="3"/>
        <!-- Syringe Tip -->
        <path d="M 370 43 L 404 46 L 404 52 L 370 55 Z" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
        <!-- Milliliter Graduations -->
        <line x1="138" y1="32" x2="138" y2="44" stroke="#0f172a" stroke-width="1.5"/><text x="138" y="80" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#334155">1.25mL (6–11lb)</text>
        <line x1="210" y1="32" x2="210" y2="44" stroke="#0f172a" stroke-width="1.5"/><text x="210" y="80" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#334155">2.5mL (12–17lb)</text>
        <line x1="297" y1="32" x2="297" y2="44" stroke="#0f766e" stroke-width="2"/><text x="297" y="80" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="800" fill="#0f766e">3.75mL (18–23lb)</text>
        <line x1="364" y1="32" x2="364" y2="44" stroke="#0f172a" stroke-width="1.5"/><text x="364" y="80" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#334155">5.0mL (24–35lb)</text>
      </g>

      <!-- Dual Medication Comparison Cards -->
      <rect x="28" y="172" width="206" height="110" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
      <text x="42" y="194" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" fill="#0f766e">ACETAMINOPHEN (TYLENOL)</text>
      <text x="42" y="216" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#0f172a">10–15 mg/kg q4–6h</text>
      <text x="42" y="238" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#334155">• Std Conc: 160 mg / 5 mL</text>
      <text x="42" y="258" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#334155">• Max 5 doses in 24 hours</text>

      <rect x="250" y="172" width="206" height="110" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
      <text x="264" y="194" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" fill="#0369a1">IBUPROFEN (≥6 MONTHS ONLY)</text>
      <text x="264" y="216" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#0f172a">10 mg/kg q6–8h</text>
      <text x="264" y="238" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#334155">• Oral Susp: 100 mg / 5 mL</text>
      <text x="264" y="258" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#334155">• Infant Drops: 50 mg / 1.25 mL</text>

      <!-- Neonatal Emergency Red Flag Box -->
      <rect x="28" y="296" width="428" height="80" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
      <text x="42" y="318" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="800" fill="#b91c1c">🚨 AAP NEONATAL FEVER ESCALATION PROTOCOL</text>
      <text x="42" y="340" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5" font-weight="700" fill="#7f1d1d">• Infant &lt;60 Days Old w/ Rectal Temp ≥100.4°F (38.0°C): Immediate ER Evaluation</text>
      <text x="42" y="360" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="600" fill="#991b1b">• Do NOT mask neonatal fever with antipyretics prior to pediatric sepsis assessment</text>
    </g>

  <!-- Bottom Clinical Triage &amp; Medical Review Bar -->
